<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Contacto al Webmaster</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f5; margin: 40px; }
        .form-card { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input[type="text"], input[type="email"], textarea { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        input[type="submit"] { margin-top: 20px; width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        input[type="submit"]:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>Contacto con el Webmaster</h2>
        <p>Complete el siguiente formulario para remitir su consulta al administrador del sitio.</p>
        
        <form action="enviar.php" method="post">
            <fieldset style="border: none; padding: 0;">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" size="25" required />

                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" size="25" required />

                <label for="texto">Comentario / Consulta:</label>
                <textarea id="texto" name="texto" cols="32" rows="6" required></textarea>

                <input type="submit" value="Enviar Consulta" />
            </fieldset>
        </form>
    </div>
</body>
</html>
