<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Formulario de Contacto - Bootstrap 4</title>
    <!-- Bootstrap CSS v4.3.1 CDN -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <!-- Estilo personalizado -->
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h2 class="h4 mb-0">Formulario de Contacto</h2>
                        <small>Práctica 3 - Ejercicio 5 (Bootstrap 4)</small>
                    </div>
                    <div class="card-body p-4">
                        <form action="#" method="post" onsubmit="event.preventDefault(); alert('Formulario procesado con éxito');">
                            <!-- Nombre -->
                            <div class="form-group">
                                <label for="nombre">Nombre completo:</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ingrese su nombre y apellido" required>
                            </div>

                            <!-- Email -->
                            <div class="form-group">
                                <label for="email">Correo Electrónico:</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="ejemplo@correo.com" required>
                            </div>

                            <!-- Teléfono -->
                            <div class="form-group">
                                <label for="telefono">Teléfono:</label>
                                <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="+54 341 555-1234" required>
                            </div>

                            <!-- Asunto -->
                            <div class="form-group">
                                <label for="asunto">Asunto:</label>
                                <input type="text" class="form-control" id="asunto" name="asunto" placeholder="Motivo de la consulta" required>
                            </div>

                            <!-- Mensaje -->
                            <div class="form-group">
                                <label for="mensaje">Cuerpo del mensaje:</label>
                                <textarea class="form-control" id="mensaje" name="mensaje" rows="5" placeholder="Escriba su mensaje aquí..." required></textarea>
                            </div>

                            <!-- Botón de envío -->
                            <button type="submit" class="btn btn-primary btn-block btn-lg mt-4">
                                Enviar Mensaje
                            </button>
                        </form>
                    </div>
                    <div class="card-footer text-muted text-center py-3">
                        <a href="bootstrap_p3_componentes.html" class="text-secondary">&larr; Volver al Dashboard de Componentes</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts Bootstrap -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
</body>
</html>
